server {
    listen 80;
    server_name _;
    absolute_redirect off;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location /admin/ {
        proxy_pass http://admin:80/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /portal {
        proxy_pass http://admin:80/portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /store {
        proxy_pass http://admin:80/store;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /generate_204 { return 302 /portal; }
    location = /gen_204 { return 302 /portal; }
    location = /hotspot-detect.html { return 302 /portal; }
    location = /library/test/success.html { return 302 /portal; }
    location = /connecttest.txt { return 302 /portal; }
    location = /ncsi.txt { return 302 /portal; }
    location = /mobile/status.php { return 302 /portal; }
    location = /redirect { return 302 /portal; }

    location = /admin {
        return 302 $scheme://$http_host/admin/;
    }

    location / {
        return 302 /portal;
    }
}
