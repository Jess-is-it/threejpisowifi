server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /admin/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /portal/notifications-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Service-Worker-Allowed "/portal" always;
        alias /usr/share/nginx/html/admin/portal/notifications-sw.js;
    }

    location = /portal/manifest.webmanifest {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        default_type application/manifest+json;
        alias /usr/share/nginx/html/admin/portal/manifest.webmanifest;
    }

    location /portal {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location /store {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /admin/index.html;
    }
}
